[package]
name = "cofox"
description = "Command-line integer factorization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cofox-core.workspace = true

# The GPU's share of the sieving, on macOS: see src/gpu.rs.
[target.'cfg(target_os = "macos")'.dependencies]
