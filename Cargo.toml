[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roticv/cofactor-oxide"
authors = ["Victor Loh"]

[workspace.dependencies]
cofox-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1

# The arithmetic is unusably slow unoptimized, so optimize it even in dev and
# test builds. Debug assertions and overflow checks stay on.
[profile.dev.package.cofox-core]
opt-level = 3
